name: Register live Streamlit deployment

# Records the existing hosted app in GitHub Deployments; does not build or deploy it.
on:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Register the hosted demo URL
        uses: actions/github-script@v7
        with:
          script: |
            const url = 'https://frostroute-ai-ai-fde-project.streamlit.app/';
            // This registers an existing browser-verified app, not an uptime check.
            // Streamlit's cookie-based redirects cannot be probed with plain fetch.
            const repo = { owner: context.repo.owner, repo: context.repo.repo };
            const { data: deployment } = await github.rest.repos.createDeployment({
              ...repo,
              ref: context.sha,
              auto_merge: false,
              required_contexts: [],
              environment: 'Streamlit Community Cloud',
              production_environment: true,
              transient_environment: false,
              description: 'Register the existing FrostRoute AI Streamlit demo URL'
            });
            await github.rest.repos.createDeploymentStatus({
              ...repo,
              deployment_id: deployment.id,
              state: 'success',
              environment_url: url,
              log_url: url,
              auto_inactive: true,
              description: 'Existing app URL registered; Streamlit manages application builds.'
            });
            await core.summary
              .addHeading('FrostRoute AI live demo')
              .addLink('Open Streamlit deployment', url)
              .addRaw(' This records the existing hosted URL, not a new application build.')
              .write();
